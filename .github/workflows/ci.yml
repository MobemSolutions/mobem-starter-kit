name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - development
      - 'review/**'   # branches de preview client Vercel

jobs:
  ci:
    name: Build · Lint · Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 EN PREMIER — pnpm v11 requiert Node >= 22.13
      # setup-node doit précéder pnpm/action-setup, sinon pnpm tourne sous Node 20 (défaut runner)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9   # pnpm v11 (latest) bloque les build scripts natifs sans approbation interactive — v9 est stable sur Node 22

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build = TypeScript strict + Next.js compilation
      # C'est le test le plus utile : attrape les erreurs TS avant Vercel
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # Bloque si une dépendance a une vulnérabilité modérée ou critique
      - name: Security audit
        run: pnpm audit --audit-level moderate

  e2e:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: pnpm e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3001

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
